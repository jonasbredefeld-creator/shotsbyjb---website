backend:
  name: git-gateway
  repo: DEIN-GITHUB-NAME/shotsbyjb-website
  branch: main
  identity_url: https://auth.decapbridge.com/sites/DEINE-SITE-ID
  gateway_url: https://gateway.decapbridge.com

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "startseite"
    label: "Startseite"
    files:
      - name: "home"
        label: "Über mich, Kontakt & Arbeiten"
        file: "data/home.json"
        fields:
          - label: "Über mich"
            name: "about"
            widget: "object"
            fields:
              - {label: "Absätze", name: "paragraphs", widget: "list", field: {label: "Absatz", name: "text", widget: "text"}}
          - label: "Kontakt"
            name: "contact"
            widget: "object"
            fields:
              - {label: "E-Mail", name: "email", widget: "string"}
              - {label: "Instagram-Link", name: "instagram", widget: "string"}
          - label: "Meine Arbeiten (Startseite)"
            name: "works"
            widget: "list"
            label_singular: "Bild"
            summary: "{{caption}}"
            fields:
              - {label: "Bild", name: "image", widget: "image"}
              - {label: "Bildunterschrift", name: "caption", widget: "string"}

  - name: "fussball"
    label: "Fußball"
    files:
      - name: "fussball"
        label: "Fußball verwalten"
        file: "data/sport-fussball.json"
        fields:
          - {label: "Anzeigename der Sportart", name: "label", widget: "string"}
          - {label: "Titelbild der Sportart (Kachel bei Galerie)", name: "cover", widget: "image"}
          - label: "Ligen"
            name: "ligen"
            widget: "list"
            label_singular: "Liga"
            summary: "{{label}}"
            fields:
              - {label: "Kürzel (keine Leerzeichen/Umlaute, intern, z.B. kreisligaa)", name: "key", widget: "string"}
              - {label: "Liga-Name", name: "label", widget: "string"}
              - {label: "Titelbild der Liga", name: "cover", widget: "image"}
              - label: "Spiele"
                name: "spiele"
                widget: "list"
                label_singular: "Spiel"
                summary: "{{heim}} vs {{gast}} — {{datum}}"
                fields:
                  - {label: "Heimteam", name: "heim", widget: "string"}
                  - {label: "Gastteam", name: "gast", widget: "string"}
                  - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
                  - label: "Fotos"
                    name: "fotos"
                    widget: "list"
                    label_singular: "Foto"
                    summary: "{{title}}"
                    fields:
                      - {label: "Bild", name: "url", widget: "image"}
                      - {label: "Bildtitel", name: "title", widget: "string"}

  - name: "basketball"
    label: "Basketball"
    files:
      - name: "basketball"
        label: "Basketball verwalten"
        file: "data/sport-basketball.json"
        fields:
          - {label: "Anzeigename der Sportart", name: "label", widget: "string"}
          - {label: "Titelbild der Sportart (Kachel bei Galerie)", name: "cover", widget: "image"}
          - label: "Ligen"
            name: "ligen"
            widget: "list"
            label_singular: "Liga"
            summary: "{{label}}"
            fields:
              - {label: "Kürzel (keine Leerzeichen/Umlaute, intern)", name: "key", widget: "string"}
              - {label: "Liga-Name", name: "label", widget: "string"}
              - {label: "Titelbild der Liga", name: "cover", widget: "image"}
              - label: "Spiele"
                name: "spiele"
                widget: "list"
                label_singular: "Spiel"
                summary: "{{heim}} vs {{gast}} — {{datum}}"
                fields:
                  - {label: "Heimteam", name: "heim", widget: "string"}
                  - {label: "Gastteam", name: "gast", widget: "string"}
                  - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
                  - label: "Fotos"
                    name: "fotos"
                    widget: "list"
                    label_singular: "Foto"
                    summary: "{{title}}"
                    fields:
                      - {label: "Bild", name: "url", widget: "image"}
                      - {label: "Bildtitel", name: "title", widget: "string"}

  - name: "baseball"
    label: "Baseball"
    files:
      - name: "baseball"
        label: "Baseball verwalten"
        file: "data/sport-baseball.json"
        fields:
          - {label: "Anzeigename der Sportart", name: "label", widget: "string"}
          - {label: "Titelbild der Sportart (Kachel bei Galerie)", name: "cover", widget: "image"}
          - label: "Ligen"
            name: "ligen"
            widget: "list"
            label_singular: "Liga"
            summary: "{{label}}"
            fields:
              - {label: "Kürzel (keine Leerzeichen/Umlaute, intern)", name: "key", widget: "string"}
              - {label: "Liga-Name", name: "label", widget: "string"}
              - {label: "Titelbild der Liga", name: "cover", widget: "image"}
              - label: "Spiele"
                name: "spiele"
                widget: "list"
                label_singular: "Spiel"
                summary: "{{heim}} vs {{gast}} — {{datum}}"
                fields:
                  - {label: "Heimteam", name: "heim", widget: "string"}
                  - {label: "Gastteam", name: "gast", widget: "string"}
                  - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
                  - label: "Fotos"
                    name: "fotos"
                    widget: "list"
                    label_singular: "Foto"
                    summary: "{{title}}"
                    fields:
                      - {label: "Bild", name: "url", widget: "image"}
                      - {label: "Bildtitel", name: "title", widget: "string"}

  - name: "fcwinterlingen"
    label: "FC Winterlingen"
    files:
      - name: "fcwinterlingen"
        label: "FC Winterlingen verwalten"
        file: "data/sport-fcwinterlingen.json"
        fields:
          - {label: "Anzeigename", name: "label", widget: "string"}
          - {label: "Titelbild (Kachel bei Galerie)", name: "cover", widget: "image"}
          - label: "Kategorien"
            name: "ligen"
            widget: "list"
            label_singular: "Kategorie"
            summary: "{{label}}"
            fields:
              - {label: "Kürzel (keine Leerzeichen/Umlaute, intern)", name: "key", widget: "string"}
              - {label: "Name", name: "label", widget: "string"}
              - {label: "Titelbild", name: "cover", widget: "image"}
              - label: "Spiele"
                name: "spiele"
                widget: "list"
                label_singular: "Spiel"
                summary: "{{heim}} vs {{gast}} — {{datum}}"
                fields:
                  - {label: "Heimteam", name: "heim", widget: "string"}
                  - {label: "Gastteam", name: "gast", widget: "string"}
                  - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
                  - label: "Fotos"
                    name: "fotos"
                    widget: "list"
                    label_singular: "Foto"
                    summary: "{{title}}"
                    fields:
                      - {label: "Bild", name: "url", widget: "image"}
                      - {label: "Bildtitel", name: "title", widget: "string"}
