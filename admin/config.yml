backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "startseite"
    label: "Startseite"
    files:
      - name: "home"
        label: "Über mich, Kontakt & Arbeiten"
        file: "data/home.json"
        fields:
          - label: "Über mich"
            name: "about"
            widget: "object"
            fields:
              - {label: "Absätze", name: "paragraphs", widget: "list", field: {label: "Absatz", name: "text", widget: "text"}}
          - label: "Kontakt"
            name: "contact"
            widget: "object"
            fields:
              - {label: "E-Mail", name: "email", widget: "string"}
              - {label: "Instagram-Link", name: "instagram", widget: "string"}
          - label: "Meine Arbeiten (Startseite)"
            name: "works"
            widget: "list"
            label_singular: "Bild"
            summary: "{{caption}}"
            fields:
              - {label: "Bild", name: "image", widget: "image"}
              - {label: "Bildunterschrift", name: "caption", widget: "string"}

  - name: "sportarten_uebersicht"
    label: "Sportarten & Ligen verwalten"
    files:
      - name: "sportarten"
        label: "Welche Sportarten & Ligen es gibt"
        file: "data/sportarten.json"
        fields:
          - label: "Sportarten"
            name: "sportarten"
            widget: "list"
            label_singular: "Sportart"
            summary: "{{label}}"
            fields:
              - {label: "Kürzel (keine Leerzeichen/Umlaute, z.B. fussball)", name: "key", widget: "string"}
              - {label: "Name", name: "label", widget: "string"}
              - {label: "Titelbild", name: "cover", widget: "image"}
              - label: "Ligen (Name + Kürzel)"
                name: "ligen"
                widget: "list"
                label_singular: "Liga"
                summary: "{{label}}"
                fields:
                  - {label: "Kürzel (keine Leerzeichen/Umlaute)", name: "key", widget: "string"}
                  - {label: "Name", name: "label", widget: "string"}
            hint: "Neue Liga hier eintragen — danach unten bei der passenden Sportart eine neue Datei mit demselben Kürzel anlegen, damit die Spiele reinkönnen."

  - name: "fussball"
    label: "Fußball"
    folder: "data/ligen/fussball"
    create: true
    slug: "{{fields.key}}"
    identifier_field: "label"
    fields:
      - {label: "Kürzel (muss zur Sportarten-Übersicht passen)", name: "key", widget: "string"}
      - {label: "Liga-Name", name: "label", widget: "string"}
      - label: "Spiele"
        name: "spiele"
        widget: "list"
        label_singular: "Spiel"
        summary: "{{heim}} vs {{gast}} — {{datum}}"
        fields:
          - {label: "Heimteam", name: "heim", widget: "string"}
          - {label: "Gastteam", name: "gast", widget: "string"}
          - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
          - label: "Fotos"
            name: "fotos"
            widget: "list"
            label_singular: "Foto"
            summary: "{{title}}"
            fields:
              - {label: "Bild", name: "url", widget: "image"}
              - {label: "Bildtitel", name: "title", widget: "string"}

  - name: "basketball"
    label: "Basketball"
    folder: "data/ligen/basketball"
    create: true
    slug: "{{fields.key}}"
    identifier_field: "label"
    fields:
      - {label: "Kürzel (muss zur Sportarten-Übersicht passen)", name: "key", widget: "string"}
      - {label: "Liga-Name", name: "label", widget: "string"}
      - label: "Spiele"
        name: "spiele"
        widget: "list"
        label_singular: "Spiel"
        summary: "{{heim}} vs {{gast}} — {{datum}}"
        fields:
          - {label: "Heimteam", name: "heim", widget: "string"}
          - {label: "Gastteam", name: "gast", widget: "string"}
          - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
          - label: "Fotos"
            name: "fotos"
            widget: "list"
            label_singular: "Foto"
            summary: "{{title}}"
            fields:
              - {label: "Bild", name: "url", widget: "image"}
              - {label: "Bildtitel", name: "title", widget: "string"}

  - name: "baseball"
    label: "Baseball"
    folder: "data/ligen/baseball"
    create: true
    slug: "{{fields.key}}"
    identifier_field: "label"
    fields:
      - {label: "Kürzel (muss zur Sportarten-Übersicht passen)", name: "key", widget: "string"}
      - {label: "Liga-Name", name: "label", widget: "string"}
      - label: "Spiele"
        name: "spiele"
        widget: "list"
        label_singular: "Spiel"
        summary: "{{heim}} vs {{gast}} — {{datum}}"
        fields:
          - {label: "Heimteam", name: "heim", widget: "string"}
          - {label: "Gastteam", name: "gast", widget: "string"}
          - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
          - label: "Fotos"
            name: "fotos"
            widget: "list"
            label_singular: "Foto"
            summary: "{{title}}"
            fields:
              - {label: "Bild", name: "url", widget: "image"}
              - {label: "Bildtitel", name: "title", widget: "string"}

  - name: "fcwinterlingen"
    label: "FC Winterlingen"
    folder: "data/ligen/fcwinterlingen"
    create: true
    slug: "{{fields.key}}"
    identifier_field: "label"
    fields:
      - {label: "Kürzel (muss zur Sportarten-Übersicht passen)", name: "key", widget: "string"}
      - {label: "Kategorie-Name", name: "label", widget: "string"}
      - label: "Spiele"
        name: "spiele"
        widget: "list"
        label_singular: "Spiel"
        summary: "{{heim}} vs {{gast}} — {{datum}}"
        fields:
          - {label: "Heimteam", name: "heim", widget: "string"}
          - {label: "Gastteam", name: "gast", widget: "string"}
          - {label: "Datum", name: "datum", widget: "string", hint: "Format: TT.MM.JJJJ"}
          - label: "Fotos"
            name: "fotos"
            widget: "list"
            label_singular: "Foto"
            summary: "{{title}}"
            fields:
              - {label: "Bild", name: "url", widget: "image"}
              - {label: "Bildtitel", name: "title", widget: "string"}
